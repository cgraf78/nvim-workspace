name: Dependabot auto-merge

# This workflow never checks out or executes pull-request code. The target
# trigger supplies the write token needed to enroll a Dependabot PR in
# repository-protected auto-merge.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  enable:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: cgraf78/actions/.github/workflows/dependabot-automerge.yml@3b726ff80de78ae9407dc1f609c11d951c56bd3b
