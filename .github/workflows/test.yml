name: Tests

on:
  push:
    # main is the only maintained branch. Keep this trigger aligned with the
    # protected default branch so retired aliases cannot hide CI drift.
    branches: [main]
  pull_request:
  schedule:
    # Stagger sibling repositories so scheduled full matrices do not compete
    # for the same runner capacity at the top of the hour.
    - cron: "27 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@2a6119d7886443929e1961a0e11b8dafa71c1978
    with:
      matrix-set: full
      profiles: base,lua,neovim,python
      # Neovim supplies the Lua runtime these tests exercise in Termux. Avoid
      # co-installing lua54 with Neovim's lua51 runtime: the live lua54 and
      # lua51 packages currently both own the generic lua++.pc metadata file.
      termux-profiles: base,neovim,python
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: tests/run

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This gate
      # verifies every unavoidable cgraf78/actions literal still matches that
      # single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@2a6119d7886443929e1961a0e11b8dafa71c1978
