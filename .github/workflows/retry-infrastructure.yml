name: Retry CI infrastructure failures

# This controller inspects run metadata and logs; it never executes the failed ref.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions: {}

jobs:
  retry:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: cgraf78/actions/.github/actions/infra-retry@cff4d77cf738c278a8c1279a89b20c9c546d9c5b
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          run-attempt: ${{ github.event.workflow_run.run_attempt }}
          conclusion: ${{ github.event.workflow_run.conclusion }}
